<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#555}iframe{border:0;display:block}
</style></head><body>
<!-- 再確認框的截圖用。?btn=btnReset 直接按下去，框就開著讓人截。 -->
<iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search);
var theme = q.get('theme') || 'dark';
var btn = q.get('btn') || 'btnReset';
var tab = q.get('tab') || 'tSetup';
var W = +(q.get('w') || 390), H = +(q.get('h') || 800);
var names = ['你','我','他','他們'];
var players = names.map(function(n,i){return {id:'p'+(i+1),no:i+1,name:n,dropped:false};});
localStorage.setItem('niceplay.state.v1', JSON.stringify({
  v:1, rev:5, theme:theme, phase:'running',
  event:{name:'週三夜間賽',date:'2026-08-16'},
  config:{format:'swiss',rounds:3,cut:0,minutes:25,tableNaming:'number',
          tableCount:2,customTables:[],rules:{win:3,draw:1,loss:0,minWinPct:0.25},liveTable:'1'},
  players:players,
  matches:[{round:1,table:'1',a:'p1',b:'p2',result:'a'},
           {round:1,table:'2',a:'p3',b:'p4',result:null}],
  timer:{running:false,endsAt:0,left:1500}
}));
localStorage.removeItem('niceplay.net.v1');
var f = document.getElementById('f');
f.style.width = W+'px'; f.style.height = H+'px';
f.src = '../index.html' + (q.get('hash') ? '#' + q.get('hash') : '');
f.onload = function(){
  var d = f.contentDocument;
  var tries = 0;
  (function go(){
    var t = d.querySelector('.tabs button[data-tab="' + tab + '"]');
    if (t && !t.disabled) t.click();
    var b = d.getElementById(btn);
    if (b) b.click();
    if (!d.getElementById('ask').hidden || ++tries > 20) {
      document.title = 'READY'; return;
    }
    setTimeout(go, 200);
  })();
};
</script></body></html>
