<!doctype html>
<html><head><meta charset="utf-8"><title>NICEPLAY 副控／選手分流測試</title></head>
<body style="margin:0;background:#111;color:#eee;font:13px/1.6 monospace">
<div style="display:flex;gap:6px">
  <iframe id="h" style="width:620px;height:820px;border:0"></iframe>
  <iframe id="s" style="width:380px;height:820px;border:0"></iframe>
  <iframe id="p" style="width:380px;height:820px;border:0"></iframe>
</div>
<pre id="out">RUNNING</pre>
<script>
/* 三個 iframe：主控（筆電）／副控（手機）／選手（手機）。
   上一版的測試只檢查了「按鈕有沒有藏起來」，
   結果漏掉最嚴重的一個 —— 選手重整之後停在設定頁，
   看得到房號、開始比賽、全部清除重來。
   所以這一版改成檢查「選手到底看得到哪一個畫面」。 */
(function () {
  var L = [], fails = 0;
  function say(s) { L.push(s); document.getElementById('out').textContent = L.join('\n'); }
  function ok(c, m) { if (!c) { fails++; say('  ✗ ' + m); } }
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  var SRV = new URLSearchParams(location.search).get('srv') || 'http://127.0.0.1:8799';
  var H = document.getElementById('h'), S = document.getElementById('s'),
      P = document.getElementById('p');

  function D(f) { return f.contentDocument; }
  function W(f) { return f.contentWindow; }
  function el(f, i) { return D(f).getElementById(i); }
  /* offsetParent 對 position:fixed 的元素永遠是 null，
     拿它判斷「看不看得見」會把整個投影／選手覆蓋層誤判成隱藏。
     改成看實際佔不佔面積。 */
  function vis(f, i) {
    var n = el(f, i);
    if (!n) return false;
    var r = n.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }
  function click(f, n) {
    if (!n) { fails++; say('  ✗ 找不到元素'); return; }
    var e = D(f).createEvent('MouseEvents'); e.initEvent('click', true, true); n.dispatchEvent(e);
  }
  function setVal(f, id, v) {
    var n = el(f, id); n.value = v;
    ['input', 'change'].forEach(function (t) {
      var e = D(f).createEvent('HTMLEvents'); e.initEvent(t, true, true); n.dispatchEvent(e);
    });
  }
  /* 同一個瀏覽器裡三個 iframe 會經 BroadcastChannel 直接同步，
     那樣就測不到伺服器；SSE 在 headless 的虛擬時間下不會結束。兩個都關掉。 */
  function iso(f) {
    try { W(f).BroadcastChannel = undefined; W(f).EventSource = undefined; } catch (e) {}
  }
  /* 只換 hash 的話瀏覽器當成同頁導覽，onload 不會再觸發，
     等 onload 的 promise 就永遠不會 resolve —— 所以每次都加一個
     不重複的查詢字串，強迫它真的重新載入。 */
  var seq = 0;
  function load(f, url) {
    var i = url.indexOf('#');
    var path = i < 0 ? url : url.slice(0, i);
    var hash = i < 0 ? '' : url.slice(i);
    var full = path + (path.indexOf('?') < 0 ? '?' : '&') + 'n=' + (++seq) + hash;
    return new Promise(function (res) { f.onload = function () { res(); }; f.src = full; });
  }

  (async function () {
    say('【0】空白狀態下分頁點得下去，而且會說要做什麼');
    var F = document.createElement('iframe');
    F.style.cssText = 'width:600px;height:500px;border:0;position:absolute;left:-9999px';
    document.body.appendChild(F);
    await load(F, '../index.html'); iso(F); W(F).localStorage.clear(); W(F).sessionStorage.clear();
    await load(F, '../index.html'); iso(F); await sleep(500);
    var tp = D(F).querySelector('.tabs button[data-tab="tPlay"]');
    ok(!tp.disabled, '對戰分頁還是 disabled');
    click(F, tp); await sleep(200);
    ok(el(F, 'tPlay').classList.contains('on'), '點了對戰分頁沒有切過去');
    ok(!el(F, 'playEmpty').hidden, '沒有顯示空狀態說明');
    ok(el(F, 'playEmptyWhy').textContent.indexOf('名單') >= 0,
       '空狀態沒告訴人要去貼名單：' + el(F, 'playEmptyWhy').textContent);
    click(F, el(F, 'btnGoSetup')); await sleep(200);
    ok(el(F, 'tSetup').classList.contains('on'), '「回設定頁」沒有作用');
    say('  ' + el(F, 'playEmptyWhy').textContent.trim() + ' ✓');
    F.src = 'about:blank';

    /* ── 主控開賽並開房 ─────────────────────── */
    say('\n【1】主控開賽、開房');
    await load(H, '../index.html');
    W(H).localStorage.clear(); W(H).sessionStorage.clear();
    await load(H, '../index.html'); iso(H); await sleep(400);

    setVal(H, 'fName', '分流測試賽');
    setVal(H, 'fPlayers', '王小明\n陳小美\n林阿明\n李大華');
    click(H, el(H, 'btnParse')); await sleep(200);
    setVal(H, 'fMinutes', '0');
    setVal(H, 'fServer', SRV);
    click(H, el(H, 'btnStart')); await sleep(400);
    click(H, el(H, 'btnHost')); await sleep(1400);

    var staffURL = el(H, 'urlStaff').value;
    var pw       = el(H, 'pwStaff').value;
    var viewURL  = el(H, 'urlView').value;
    ok(/#sub(&|$)/.test(staffURL), '副控網址不對：' + staffURL);
    ok(/^[A-Z0-9]{6}$/.test(pw), '副控密碼不對：' + pw);
    ok(/#join=[A-Z0-9]{6}(&|$)/.test(viewURL), '選手網址不對：' + viewURL);
    ok(staffURL.indexOf('srv=') > 0, '自架伺服器時連結沒有帶位址：' + staffURL);
    ok(viewURL.indexOf(pw) < 0, '選手網址裡竟然含有副控密碼');
    say('  副控 ' + staffURL.replace(/^https?:\/\/[^/]*/, '') + ' + 密碼 ' + pw);
    say('  選手 ' + viewURL.replace(/^https?:\/\/[^/]*/, '') + ' ✓');

    say('\n【2】沒有大字房號了，改成可複製的欄位');
    ok(!D(H).querySelector('.roomcode'), '還留著大字房號');
    ok(el(H, 'urlStaff').tagName === 'INPUT', '副控網址不是可複製的輸入框');
    say('  兩條都是 readonly input，旁邊有複製鈕 ✓');

    say('\n【2b】身分存在分頁，不存在整臺電腦');
    /* 存 localStorage 的話同一個網域所有分頁共用一份身分，
       主控開第二個分頁想當副控就會直接繼承主控。 */
    ok(!!W(H).sessionStorage.getItem('niceplay.net.v1'), '身分沒有存進 sessionStorage');
    ok(!W(H).localStorage.getItem('niceplay.net.v1'),
       '身分還留在 localStorage —— 那樣所有分頁會共用同一個身分');
    var backup = W(H).localStorage.getItem('niceplay.host.v1');
    ok(!!backup, '主控沒有留備援（關掉瀏覽器再開就接不回房間了）');
    ok(backup && JSON.parse(backup).role === 'host', '備援存的不是主控身分');
    ok(backup && JSON.parse(backup).hostToken, '備援沒有 hostToken，接回去也推不了狀態');
    say('  身分在 sessionStorage，主控另有一份 localStorage 備援 ✓');

    say('\n【3】選手 QR 不用按任何按鈕就看得到');
    ok(!el(H, 'sideQR').hidden, '設定頁「給選手」那格沒有直接畫出 QR');
    ok(D(H).querySelector('#sideQRImg svg'), '設定頁的 QR 沒有內容');
    ok(!el(H, 'pvQR').hidden, '投影 QR 沒有出現');
    ok(D(H).querySelector('#pvQRImg svg'), '投影 QR 沒有畫出來');
    /* 開賽之後畫面會自動切到對戰頁，設定頁那格量不到大小 —— 先切回去再量 */
    click(H, D(H).querySelector('.tabs button[data-tab="tSetup"]')); await sleep(150);
    var qsz = D(H).querySelector('#sideQRImg svg').getBoundingClientRect();
    ok(qsz.width > 60 && qsz.height > 60, 'QR 太小：' + Math.round(qsz.width) + 'px');
    say('  設定頁與投影都直接畫出來了，' + Math.round(qsz.width) + 'px ✓');

    say('\n【3b】投影開在另一個視窗、之後才開房 —— QR 一樣要出來');
    /* 房間資訊如果只存在連線層，另一個視窗（投影）根本不知道你開了房。
       所以選手碼要放進 state，靠 BroadcastChannel／伺服器一起送過去。 */
    var V2 = document.createElement('iframe');
    V2.style.cssText = 'width:600px;height:400px;border:0;position:absolute;left:-9999px';
    document.body.appendChild(V2);
    await load(V2, '../index.html#present');    /* 故意不 iso：模擬真的第二個視窗會收到廣播 */
    try { W(V2).EventSource = undefined; } catch (e) {}
    await sleep(900);
    ok(D(V2).body.classList.contains('present'), '第二個視窗沒有進投影模式');
    /* 投影視窗絕對不能連線 —— 它跟控制台共用 hostToken，
       兩邊都推狀態就會互推到天荒地老，伺服器被打爆。 */
    ok(!W(V2).sessionStorage.getItem('__never__'), '');
    ok(el(V2, 'netPill').hidden || !el(V2, 'netPill').textContent,
       '投影視窗竟然也連上線了：' + el(V2, 'netPill').textContent);
    ok(!el(V2, 'pvQR').hidden, '另一個視窗的投影畫面沒有 QR');
    ok(D(V2).querySelector('#pvQRImg svg'), '另一個視窗的 QR 沒有內容');
    ok(JSON.parse(W(V2).localStorage.getItem('niceplay.state.v1')).room.view === viewURL.match(/#join=([A-Z0-9]+)/)[1],
       '投影視窗拿到的選手碼不對');
    say('  第二個視窗照樣畫得出 QR ✓');
    /* 用完就收掉。headless 的虛擬時鐘會被「有請求在飛」暫停，
       多留一個一直輪詢的視窗，整個測試就永遠跑不完。 */
    V2.src = 'about:blank';

    say('\n【3c】state 裡不能有副控密碼');
    var shared = JSON.parse(W(H).localStorage.getItem('niceplay.state.v1'));
    ok(JSON.stringify(shared).indexOf(pw) < 0,
       'state 裡竟然含有副控密碼 —— 選手也會收到這份狀態');
    ok(shared.room && shared.room.view, 'state 裡沒有選手碼');
    say('  state 只有選手碼，沒有副控密碼 ✓');

    /* ── 副控：網址 + 密碼 ─────────────────── */
    say('\n【3d】投影的 QR 不能蓋到任何一格對戰');
    /* 投影畫面每一格都是有人要看的資訊，浮在上面一定會擋到誰。
       QR 排進頁尾那一列，用實際座標驗證重疊為零。 */
    W(H).location.hash = 'present';
    D(H).body.classList.add('present');
    var rz = D(H).createEvent('HTMLEvents'); rz.initEvent('resize', true, true);
    W(H).dispatchEvent(rz);
    await sleep(600);
    var qr = el(H, 'pvQR').getBoundingClientRect();
    /* QR 用 vw 排版，所以門檻要跟著這個視窗的寬度算。
       真的投影機是 1920 寬，3.6vw 大約 69px。 */
    var vw = W(H).innerWidth;
    ok(qr.width > vw * 0.06 && qr.height > vw * 0.03,
       '投影 QR 太小：' + Math.round(qr.width) + '×' + Math.round(qr.height) +
       '（視窗寬 ' + vw + '）');
    var worst = 0;
    D(H).querySelectorAll('.pv-seat').forEach(function (n) {
      var r = n.getBoundingClientRect();
      var ox = Math.min(r.right, qr.right) - Math.max(r.left, qr.left);
      var oy = Math.min(r.bottom, qr.bottom) - Math.max(r.top, qr.top);
      if (ox > 0 && oy > 0) worst = Math.max(worst, ox * oy);
    });
    ok(worst === 0, '投影 QR 蓋住了對戰格，重疊 ' + Math.round(worst) + ' px²');
    var ftr = D(H).querySelector('.pv-ft').getBoundingClientRect();
    ok(qr.bottom <= ftr.bottom + 1 && qr.top >= ftr.top - 1, 'QR 沒有待在頁尾裡');
    say('  QR ' + Math.round(qr.width) + '×' + Math.round(qr.height) +
        '，與對戰格重疊 0 px² ✓');
    D(H).body.classList.remove('present');
    W(H).location.hash = '';
    await sleep(300);

    say('\n【3e】每個名字後面都有幾勝幾敗');
    click(H, D(H).querySelector('.tabs button[data-tab="tPlay"]')); await sleep(200);
    var sides = D(H).querySelectorAll('#matchList .mt .sd:not(.bye)');
    ok(sides.length > 0, '對戰卡不見了');
    var withRec = 0;
    sides.forEach(function (n) {
      var r = n.querySelector('.rec');
      if (r && /^\d+-\d+/.test(r.textContent.trim())) withRec++;
    });
    ok(withRec === sides.length,
       '有 ' + (sides.length - withRec) + ' 個名字後面沒有戰績');
    say('  對戰卡 ' + sides.length + ' 個名字全部帶著戰績（' +
        sides[0].querySelector('.rec').textContent.trim() + ' 這種）✓');

    say('\n【4】副控：打開網址看到密碼輸入畫面');
    var staffHash = staffURL.slice(staffURL.indexOf('#'));
    await load(S, '../index.html'); iso(S); W(S).localStorage.clear(); W(S).sessionStorage.clear();
    await load(S, '../index.html' + staffHash); iso(S); await sleep(600);
    ok(D(S).body.classList.contains('staffgate'), '沒有進入副控密碼畫面');
    ok(vis(S, 'stCode'), '看不到密碼輸入框');
    ok(!vis(S, 'fPlayers'), '副控竟然看得到設定頁的名單框');
    ok(!vis(S, 'btnStart'), '副控竟然看得到「開始比賽」');
    say('  只有一個密碼框，設定頁完全看不到 ✓');

    say('\n【5】副控輸入密碼進去');
    setVal(S, 'stCode', pw);
    click(S, el(S, 'btnStJoin')); await sleep(1600);
    ok(!D(S).body.classList.contains('staffgate'), '密碼對了卻還卡在輸入畫面');
    ok(D(S).body.classList.contains('guest'), '沒有進入副控模式');
    ok(el(S, 'tPlay').classList.contains('on'), '沒有自動切到對戰頁');
    ok(!vis(S, 'fPlayers'), '副控看得到設定頁的名單框');
    ok(!vis(S, 'btnStart'), '副控看得到「開始比賽」');
    ok(!vis(S, 'btnReset'), '副控看得到「全部清除重來」');
    say('  進到對戰頁，設定頁的東西一個都看不到 ✓');

    say('\n【6】副控可以回報，主控收得到');
    var card = D(S).querySelectorAll('#matchList .mt')[0];
    var tbl = card.querySelector('.tb').textContent.trim();
    click(S, card.querySelectorAll('.sd')[0]);
    await sleep(2400);
    var hs = JSON.parse(W(H).localStorage.getItem('niceplay.state.v1'));
    var hm = hs.matches.filter(function (m) { return String(m.table) === tbl; })[0];
    ok(hm && hm.result === 'a', '主控沒收到副控的回報');
    say('  副控點第 ' + tbl + ' 桌 → 主控收到 ✓');

    /* ── 選手：掃 QR 進來，零輸入 ─────────── */
    say('\n【7】選手：連結一開就進查詢畫面，不用打任何東西');
    var joinHash = viewURL.slice(viewURL.indexOf('#'));
    await load(P, '../index.html'); iso(P); W(P).localStorage.clear(); W(P).sessionStorage.clear();
    await load(P, '../index.html' + joinHash); iso(P); await sleep(1800);
    ok(D(P).body.classList.contains('player'), '沒有進入選手畫面');
    ok(vis(P, 'watch'), '選手畫面沒有顯示');
    say('  #join= 直接進去 ✓');

    say('\n【8】選手看不到任何控制台的東西');
    ['fPlayers', 'btnStart', 'btnReset', 'btnHost', 'fServer',
     'btnNext', 'btnRepair', 'btnTimer', 'btnPresent', 'btnBook'].forEach(function (id) {
      ok(!vis(P, id), '選手竟然看得到 #' + id);
    });
    ok(!vis(P, 'tSetup'), '選手看得到設定頁');
    ok(!D(P).querySelector('.tabs').offsetParent, '選手看得到分頁列');
    say('  設定、開始比賽、清除重來、分頁列 —— 一個都看不到 ✓');

    say('\n【9】選手挑自己的名字 → 直接寫第幾桌');
    var chips = D(P).querySelectorAll('#meList .nm');
    ok(chips.length === 4, '名字選單應該 4 個，實際 ' + chips.length);
    click(P, chips[0]); await sleep(400);
    ok(el(P, 'wtMe').hidden === false, '選完之後沒有顯示');
    ok(el(P, 'wtPlayer').textContent === '王小明', '名字不對：' + el(P, 'wtPlayer').textContent);
    ok(/^[0-9A-Z]+$/.test(el(P, 'wtTable').textContent.trim()) ||
       el(P, 'wtTable').textContent.indexOf('輪空') >= 0,
       '桌號沒出來：' + el(P, 'wtTable').textContent);
    ok(el(P, 'wtOpp').textContent.indexOf('對手') >= 0, '沒寫對手是誰');
    ok(el(P, 'wtStat').textContent.indexOf('名') >= 0, '沒寫目前第幾名');
    ok(D(P).querySelectorAll('#wtMatches .wr.mine').length === 1, '對戰表沒有標出自己那一桌');
    say('  ' + el(P, 'wtPlayer').textContent + ' → 第 ' +
        el(P, 'wtTable').textContent + ' 桌 · ' +
        el(P, 'wtOpp').textContent.replace(/\s+/g, ' ').trim() + ' · ' +
        el(P, 'wtStat').textContent.trim() + ' ✓');

    say('\n【9b】選手畫面的對戰表也要有戰績');
    var wsides = D(P).querySelectorAll('#wtMatches .wr .p');
    ok(wsides.length > 0, '選手畫面沒有對戰列');
    var wRec = 0;
    wsides.forEach(function (n) {
      var e = n.querySelector('em');
      if (e && /^\d+-\d+/.test(e.textContent.trim())) wRec++;
    });
    ok(wRec === wsides.length, '選手畫面有 ' + (wsides.length - wRec) + ' 個名字沒有戰績');
    say('  選手畫面 ' + wsides.length + ' 個名字全部帶著戰績 ✓');

    say('\n【10】選手重整之後還是選手畫面（上一版就是這裡壞掉）');
    await load(P, '../index.html' + joinHash); iso(P); await sleep(1800);
    ok(D(P).body.classList.contains('player'), '重整後掉出選手畫面');
    ok(!vis(P, 'fPlayers'), '重整後看得到設定頁的名單框');
    ok(!vis(P, 'btnReset'), '重整後看得到「全部清除重來」');
    ok(el(P, 'wtPlayer').textContent === '王小明', '重整後忘記選手是誰');
    say('  重整後仍在選手畫面，記得是誰 ✓');

    say('\n【10b】同一臺電腦：主控分頁與副控分頁是不同身分');
    /* 身分如果存在 localStorage，同一個網域所有分頁共用一份，
       副控分頁會直接繼承主控身分 —— 同一臺電腦就分不出誰是誰。 */
    ok(el(H, 'netPill').textContent.indexOf('主控') === 0,
       '主控分頁的身分跑掉了：' + el(H, 'netPill').textContent);
    ok(el(S, 'netPill').textContent.indexOf('副控') === 0,
       '副控分頁沒有維持副控身分：' + el(S, 'netPill').textContent);
    ok(D(H).body.classList.contains('guest') === false, '主控分頁被降成副控');
    ok(D(S).body.classList.contains('guest') === true, '副控分頁不是副控');
    /* 分頁之間真正的隔離由【10c】驗 —— 這個測試的畫面都是同一個分頁裡的
       iframe，會共用 sessionStorage 與 localStorage，量不出分頁差異。 */
    say('  主控 ' + el(H, 'netPill').textContent.trim() +
        '　副控 ' + el(S, 'netPill').textContent.trim() + ' ✓');

    say('\n【10c】新開一個分頁走 #sub，不會繼承主控身分');
    var N = document.createElement('iframe');
    N.style.cssText = 'width:400px;height:500px;border:0;position:absolute;left:-9999px';
    document.body.appendChild(N);
    await load(N, '../index.html' + staffHash); iso(N); await sleep(700);
    ok(D(N).body.classList.contains('staffgate'), '新分頁沒有停在密碼畫面（繼承了主控身分）');
    ok(el(N, 'netPill').hidden || el(N, 'netPill').textContent.indexOf('主控') < 0,
       '新分頁直接變成主控了：' + el(N, 'netPill').textContent);
    say('  乾淨地停在密碼畫面 ✓');
    N.src = 'about:blank';

    say('\n【11】選手改不動勝負（伺服器擋，不是只藏按鈕）');
    var vcode = joinHash.replace('#join=', '').split('&')[0];
    var bad = await fetch(SRV + '/api/rooms/' + vcode + '/action', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ op: 'result', round: 1, table: '1', value: 'b' })
    });
    ok(bad.status === 403, '繞過前端直接打 API 竟然沒被擋，HTTP ' + bad.status);
    say('  直接打 API → HTTP 403 ✓');

    /* ── 分頁不再灰掉 ─────────────────────── */
    say('');
    say(fails === 0 ? '副控／選手分流全部通過 ✅' : '有 ' + fails + ' 項失敗 ❌');
    say('DONE');
  })().catch(function (e) { say('EXCEPTION ' + e.message + '\n' + e.stack); say('DONE'); });
})();
